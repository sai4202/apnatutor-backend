spring:
  application:
    name: apnatutor

  config:
    # Loads backend/.env as a property source, so every ${VAR} below resolves
    # from it. No extra dependency needed - Spring treats the file as
    # .properties via the [.properties] extension hint.
    #
    # This project is self-contained: the path never escapes backend/, so the
    # backend can be cloned, built and run on its own. The frontend keeps its
    # own .env.local and the two share nothing at the filesystem level.
    #
    # 'optional:' means a missing file is not an error - real environments
    # supply these as actual environment variables instead of a file.
    import: optional:file:./.env[.properties]

  datasource:
    url: ${APNATUTOR_DB_URL:jdbc:postgresql://localhost:5432/apnatutor_dev}
    username: ${APNATUTOR_DB_USER:apnatutor}
    password: ${APNATUTOR_DB_PASSWORD:apnatutor}
    hikari:
      pool-name: apnatutor-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      # NEVER change this to 'update'. Flyway owns the schema. See SOURCE_OF_TRUTH.md section 7.
      ddl-auto: validate
    # Off deliberately: keeps transactions inside the service layer and stops
    # lazy-loading from leaking into serialisation.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      # The outer limit. Per-kind caps are stricter and enforced in FileKind —
      # 5MB for a photo, 10MB for a document — so this only stops a request that
      # is oversized before any application code sees it.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
    # Turn OFF in production: an always-on schema dump is free reconnaissance.
    enabled: ${APNATUTOR_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${APNATUTOR_API_DOCS_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    # Don't send the docs page's own schema-fetch through "Try it out".
    display-request-duration: true

apnatutor:
  # Where the browser app runs; used for CORS and for links in emails/SMS.
  frontend-url: ${APNATUTOR_FRONTEND_URL:http://localhost:3000}

  jwt:
    # Dev-only default. Production MUST supply APNATUTOR_JWT_SECRET (>= 32 bytes).
    secret: ${APNATUTOR_JWT_SECRET:dev-only-insecure-secret-change-me-in-production-0123456789}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D

  otp:
    ttl: PT10M
    max-attempts: 5
    max-sends-per-hour: 5

  # Per-IP allowances per minute (M5-07). Sized for "one address behaving badly",
  # not "one person behaving normally": Indian mobile networks use carrier-grade
  # NAT heavily, so one address can be a whole neighbourhood.
  #
  # public-per-minute is large on purpose. The Next.js frontend renders public
  # pages server-side, so every SEO page view reaches /api/v1/public/** from the
  # frontend server's single address rather than the visitor's, unless the
  # deployment forwards X-Forwarded-For. See PENDING T21.
  rate-limit:
    auth-per-minute: ${APNATUTOR_RATE_AUTH:20}
    admin-per-minute: ${APNATUTOR_RATE_ADMIN:120}
    public-per-minute: ${APNATUTOR_RATE_PUBLIC:3000}
    api-per-minute: ${APNATUTOR_RATE_API:300}
    # Per tutor, per hour. Not an IP limit - see LeadUnlockService.
    unlocks-per-hour-per-tutor: ${APNATUTOR_RATE_UNLOCKS:30}

  # Local development conveniences. EVERY ONE OF THESE IS A SECURITY HOLE IN
  # PRODUCTION - they seed accounts with a published OTP and return generated
  # codes in API responses.
  #
  # DevModeGuard refuses to start the application if this is true alongside a
  # real SMS provider or a 'prod' profile, so it cannot be left on by accident.
  dev:
    enabled: ${APNATUTOR_DEV_MODE:true}
    test-account-code: ${APNATUTOR_DEV_OTP:123456}

  # Authoritative values live in SOURCE_OF_TRUTH.md section 3. Keep them in sync.
  leads:
    unlock-cap: 5
    requirement-ttl: P30D
    online-only-multiplier: 0.8

  credits:
    signup-bonus: 10
    purchased-validity: P365D
    bonus-validity: P90D
    refund-window: P7D

  storage:
    # 'local' writes to the directory below; 's3' is wired in later for production.
    provider: ${APNATUTOR_STORAGE_PROVIDER:local}
    local-path: ${APNATUTOR_STORAGE_PATH:./uploads}

  sms:
    # 'console' logs the OTP to stdout instead of sending it. Never use in production.
    provider: ${APNATUTOR_SMS_PROVIDER:console}

  mail:
    provider: ${APNATUTOR_MAIL_PROVIDER:console}

  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

logging:
  # %X{correlationId} surfaces the ID set by CorrelationIdFilter, so every line of a
  # request can be pulled together from the header returned to the caller.
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    com.apnatutor: DEBUG
    org.flywaydb: INFO

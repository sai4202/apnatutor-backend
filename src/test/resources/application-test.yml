# Integration tests run against a REAL local PostgreSQL database.
#
# Testcontainers would normally do this, but this project has no Docker
# (SOURCE_OF_TRUTH.md ADR #5), so we use a dedicated local database instead.
# Create it once from backend/:  psql -U postgres -f scripts/db-setup.sql
#
# Flyway rebuilds the schema from scratch for each test run via clean+migrate,
# so tests never inherit state from a previous run.

spring:
  datasource:
    url: ${APNATUTOR_TEST_DB_URL:jdbc:postgresql://localhost:5432/apnatutor_test}
    username: ${APNATUTOR_TEST_DB_USER:apnatutor}
    password: ${APNATUTOR_TEST_DB_PASSWORD:apnatutor}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Safe here and ONLY here: this database is disposable by definition.
    # clean-disabled must never be false for dev or production datasources.
    #
    # The clean itself is performed by TestFlywayConfig, not by a property.
    # Flyway's old clean-on-validation-error option was REMOVED in Flyway 9/10 —
    # setting it here would be silently ignored, which is worse than not setting it.
    clean-disabled: false

apnatutor:
  jwt:
    secret: test-only-secret-not-used-anywhere-else-0123456789abcdef
  sms:
    provider: console
  # Off in tests: the existing auth tests assert real rate limits and random
  # codes, and seeded accounts with a fixed OTP would quietly bypass exactly the
  # behaviour those tests exist to verify. Dev mode gets its own test instead.
  dev:
    enabled: false
  mail:
    provider: console
  storage:
    provider: local
    local-path: ./build/test-uploads

logging:
  level:
    com.apnatutor: DEBUG
    org.hibernate.SQL: DEBUG
